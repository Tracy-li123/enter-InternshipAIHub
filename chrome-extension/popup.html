<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>职达实习生 - 岗位采集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 20px;
      color: #333;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    
    .status-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #667eea;
      color: white;
    }
    
    .status-text {
      flex: 1;
    }
    
    .status-text h3 {
      font-size: 14px;
      margin-bottom: 3px;
      color: #333;
    }
    
    .status-text p {
      font-size: 12px;
      color: #666;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }
    
    .btn-secondary:hover {
      background: #f8f9fa;
    }
    
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    
    .loading.active {
      display: block;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .success {
      background: #4caf50;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
      margin-bottom: 10px;
    }
    
    .success.active {
      display: block;
    }
    
    .error {
      background: #f44336;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
      margin-bottom: 10px;
    }
    
    .error.active {
      display: block;
    }
    
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 11px;
      opacity: 0.8;
    }
    
    .config {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }
    
    .config label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .config input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 职达实习生</h1>
    <p>岗位采集助手</p>
  </div>
  
  <div class="card">
    <div id="successMsg" class="success"></div>
    <div id="errorMsg" class="error"></div>
    
    <div class="status">
      <div class="status-icon">📋</div>
      <div class="status-text">
        <h3 id="websiteName">检测中...</h3>
        <p id="websiteStatus">等待页面加载</p>
      </div>
    </div>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>正在采集岗位信息...</p>
    </div>
    
    <button id="extractBtn" class="btn btn-primary">
      🚀 采集当前岗位
    </button>
    
    <button id="openPlatformBtn" class="btn btn-secondary">
      📱 打开职达实习生平台
    </button>
    
    <!-- 连接状态显示 -->
    <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2); margin-top: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 16px;">✅</span>
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 600; color: white;">已连接到后端</div>
          <div style="font-size: 10px; opacity: 0.9; color: rgba(255,255,255,0.9); margin-top: 2px;">mqlhknolbjnsfrqyzidh.supabase.co</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    © 2026 职达实习生 · 让求职更简单
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
